name: timed_notifications

on:
  schedule:
    # JST 06:03-08:43 every 20 minutes on TSE business-day candidates.
    # Off-peak minutes plus nine attempts reduce hosted-runner delay risk.
    - cron: "3,23,43 21-23 * * 0-4"
    # JST 11:50, 12:00, 12:10.
    - cron: "50 2 * * 1-5"
    - cron: "0,10 3 * * 1-5"
    # JST 18:50, 19:00, 19:10.
    - cron: "50 9 * * 1-5"
    - cron: "0,10 10 * * 1-5"
    # JST 20:10, after the final TDnet poll, for the once-daily system summary.
    - cron: "10 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      SLACK_WEBHOOK_PO: ${{ secrets.SLACK_WEBHOOK_PO }}
      SLACK_WEBHOOK_IPO: ${{ secrets.SLACK_WEBHOOK_IPO }}
      SLACK_WEBHOOK_BUNBAI: ${{ secrets.SLACK_WEBHOOK_BUNBAI }}
      SLACK_WEBHOOK_CB: ${{ secrets.SLACK_WEBHOOK_CB }}
      SLACK_WEBHOOK_SPLIT: ${{ secrets.SLACK_WEBHOOK_SPLIT }}
      SLACK_WEBHOOK_SYSTEM: ${{ secrets.SLACK_WEBHOOK_SYSTEM }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Send time-gated notifications
        run: python -m src.run_daily --notifications-only
      - name: Commit state changes
        if: always()
        run: bash scripts/commit_state.sh
