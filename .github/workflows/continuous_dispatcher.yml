name: continuous_dispatcher

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: notifier-continuous-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private && vars.NOTIFIER_CONTINUOUS_DISPATCHER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      NOTIFIER_CONTINUOUS_DISPATCHER: ${{ vars.NOTIFIER_CONTINUOUS_DISPATCHER }}
      SLACK_WEBHOOK_SYSTEM: ${{ secrets.SLACK_WEBHOOK_SYSTEM }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Dispatch and monitor main workflows
        run: python -m scripts.cloud_dispatcher --live
